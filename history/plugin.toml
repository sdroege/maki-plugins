min_maki_version = "0.6.0"

# The agent.compact.before layer steers what the agent does next, and every
# agent.* slot costs every permission, so the manifest asks for all of them
# even though the plugin itself only reads the session's transcript.
[permissions]
fs_read = true
fs_write = true
net = true
run = true
env = true
agent = true
session_read = true
session_write = true
session_settings = true
input = true
